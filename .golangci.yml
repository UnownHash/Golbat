version: "2"

# Run via `make lint` (or pass the same package list): a bare
# `golangci-lint run` also analyses the generated pogo/ package as a root and
# takes several minutes longer on a cold cache.
run:
  build-tags:
    - go_json
  timeout: 10m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

  settings:
    errcheck:
      # Close/Copy on read paths is a standard Go idiom; a deferred Close
      # error after a successful read has nowhere actionable to go.
      exclude-functions:
        - (io.Closer).Close
        - (*database/sql.Rows).Close
        - (*github.com/jmoiron/sqlx.Rows).Close
        - io.Copy
        - (*encoding/json.Decoder).Decode

  exclusions:
    # Drop reports from files carrying a "Code generated ... DO NOT EDIT."
    # header (pogo/vbase.pb.go, grpc/*.pb.go). This is the v2 default; it is
    # spelled out because it only filters reports — it does not skip
    # analysis. To keep lint fast, `make lint` and CI also leave the
    # generated pogo package out of the lint targets.
    generated: strict
    rules:
      # Entity access pattern: each entity type provides peek*Record /
      # get*RecordReadOnly / get*RecordForUpdate even when not currently
      # called, to keep the access-pattern API symmetric across entities.
      # See CLAUDE.md "Record Access Patterns".
      - linters:
          - unused
        path: decoder/
        text: "func (peek|get)[A-Z][A-Za-z]+Record(ReadOnly|ForUpdate)? is unused"
