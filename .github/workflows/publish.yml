name: publish

on:
  push:
  pull_request:

env:
  GO_VERSION: '1.26.x'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install dependencies
        run: go get .
      - name: Test with the Go CLI
        # -tags go_json matches the Dockerfile's production build
        # (CGO_ENABLED=0 go build -tags go_json) — without it this suite
        # verifies a binary nothing ships.
        run: go test -v -tags go_json ./...
      - name: Test with the Go CLI (dbdebug build)
        # dbdebug swaps in a real debugChangeAccumulator (see db_debug.go);
        # nothing else in CI exercises that build, and this PR touches it.
        run: go test -v -tags "go_json dbdebug" ./...

  build:
    # Registry push only follows a real push (branch or tag), never a PR —
    # including same-repo PRs, to avoid publishing an image per PR sync.
    # A fork PR wouldn't have write access to secrets.GITHUB_TOKEN's
    # elevated permissions anyway; this keeps the behavior explicit rather
    # than relying on that.
    if: github.event_name == 'push'
    needs: [test]
    permissions:
      contents: read
      packages: write
    uses: docker/github-builder/.github/workflows/build.yml@v1
    with:
      output: image
      push: true
      cache: true
      platforms: linux/amd64,linux/arm64
      meta-images: ghcr.io/${{ github.repository }}
      meta-tags: |
        type=ref,event=branch
      set-meta-labels: true
      sign: false
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
